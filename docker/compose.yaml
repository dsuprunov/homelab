name: homelab

services:
  homelab:
    image: homelab-dev:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    init: true
    dns:
      - 192.168.178.206
      - 1.1.1.1
    volumes:
      - ..:/home/homelab/git-homelab
      - ${HOME}/.homelab/kube:/home/homelab/.kube
      - ${HOME}/.homelab/ssh:/home/homelab/.ssh
      - type: bind
        source: ${SSH_AUTH_SOCK:?Start ssh-agent and load the infrastructure key}
        target: /run/host-ssh-agent
        bind:
          create_host_path: false
      - packer-cache:/home/homelab/.cache/packer
    environment:
      SSH_AUTH_SOCK: /run/host-ssh-agent
      ANSIBLE_CONFIG: /home/homelab/git-homelab/ansible/ansible.cfg
      KUBECONFIG: /home/homelab/.kube/config
      PACKER_CACHE_DIR: /home/homelab/.cache/packer

volumes:
  packer-cache:
    name: homelab-packer-cache
